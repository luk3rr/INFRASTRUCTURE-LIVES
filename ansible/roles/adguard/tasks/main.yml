---
- name: Configure network interfaces for AdGuard VM
  ansible.builtin.template:
    src: interfaces.j2
    dest: /etc/network/interfaces
    mode: '0644'
    backup: true
  notify: Restart networking

- name: AdGuard | Set version fact
  ansible.builtin.set_fact:
    adguard_version: "v0.107.64"
    adguard_download_url: "https://github.com/AdguardTeam/AdGuardHome/releases/download/v0.107.64/AdGuardHome_linux_amd64.tar.gz"

- name: AdGuard | Download and unarchive
  ansible.builtin.unarchive:
    src: "{{ adguard_download_url }}"
    dest: /opt/
    remote_src: yes
    creates: /opt/AdGuardHome/AdGuardHome

- name: AdGuard | Configure AdGuardHome.yaml
  ansible.builtin.template:
    src: AdGuardHome.yaml.j2
    dest: /opt/AdGuardHome/AdGuardHome.yaml
    mode: '0644'
  notify: Restart AdGuard

- name: AdGuard | Install as a service and start
  ansible.builtin.command:
    cmd: /opt/AdGuardHome/AdGuardHome -s install
    creates: /etc/systemd/system/AdGuardHome.service

- name: Verify IPv6 configuration
  ansible.builtin.command: ip -6 addr show dev eth0
  register: ipv6_result
  changed_when: false