---
- name: Persist IPv6 disable in sysctl.d
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-disable-ipv6.conf
    content: |
      net.ipv6.conf.all.disable_ipv6 = 1
      net.ipv6.conf.default.disable_ipv6 = 1
      net.ipv6.conf.lo.disable_ipv6 = 1
    mode: '0644'

- name: Apply sysctl settings
  ansible.builtin.command: sysctl -p /etc/sysctl.d/99-disable-ipv6.conf
  changed_when: false
  failed_when: false
  register: sysctl_result

- name: Check if IPv6 is already disabled at kernel level
  ansible.builtin.debug:
    msg: "IPv6 appears to be disabled at kernel level (sysctl files not found). This is expected if IPv6 was disabled via GRUB."
  when: sysctl_result.rc != 0
